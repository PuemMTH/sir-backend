name = "sir-api"
main = "build/worker.mjs"
compatibility_date = "2024-09-01"
account_id = "2712d214b23c083a4283f310728aa4bb"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[build]
command = "make build-std"

[[d1_databases]]
binding = "DB"
database_name = "sir-db"
database_id = "0edbbf1d-aa42-4eed-ac85-e698e9b9783a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "LATEX_BUCKET"
bucket_name = "sir-latex-files"

[vars]
COMPILE_URL = "https://ipulab.com/service/latex-server/compile"
